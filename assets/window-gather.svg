<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Window Gather</title>
  <desc>Two overlapping windows gather into a blue destination monitor.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#278CB8" />
      <stop offset="1" stop-color="#17638E" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#214F8D" />
      <stop offset="1" stop-color="#153463" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32A9F5" />
      <stop offset="1" stop-color="#1765D1" />
    </linearGradient>
  </defs>
  <rect x="16" y="36" width="112" height="84" rx="12" fill="url(#back)" />
  <rect x="24" y="52" width="96" height="60" rx="5" fill="#B6EAF5" />
  <rect x="68" y="12" width="116" height="96" rx="14" fill="url(#back)" />
  <rect x="76" y="28" width="100" height="72" rx="6" fill="#D8F5FF" />
  <rect x="124" y="212" width="32" height="26" rx="4" fill="#214B80" />
  <rect x="96" y="234" width="88" height="10" rx="5" fill="#214B80" />
  <rect x="40" y="80" width="200" height="144" rx="20" fill="url(#frame)" />
  <rect x="52" y="92" width="176" height="108" rx="10" fill="url(#screen)" />
  <polyline points="86,120 118,152 190,152" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="168,130 190,152 168,174" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="140" cy="212" r="3" fill="#8ACDF4" />
</svg>
